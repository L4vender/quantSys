enabled = false
clob_api_base_url = "https://clob.polymarket.com"
gamma_api_base_url = "https://gamma-api.polymarket.com"
market_ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
user_ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/user"
geoblock_url = "https://polymarket.com/api/geoblock"
server_time_url = "https://clob.polymarket.com/time"
heartbeat_interval_seconds = 10
stale_after_seconds = 30
rest_timeout_ms = 5000
ws_connect_timeout_ms = 5000
max_reconnect_attempts = 5
custom_feature_enabled = true
execution_enabled = false
geoblock_required = true
signing_mode = "POLY_1271"
wallet_mode = "deposit_wallet"
live_order_type = "FAK_MARKETABLE_LIMIT"
max_token_subscriptions = 1000
token_cache_ttl_seconds = 300

[l2_auth_env]
api_key = "POLYMARKET_API_KEY"
secret = "POLYMARKET_SECRET"
passphrase = "POLYMARKET_PASSPHRASE"

[market_channel]
type = "market"
assets_ids = []

[user_channel]
type = "user"
markets = []

[reconnect_backoff]
initial_ms = 500
max_ms = 30000
jitter_ms = 250

[rate_budgets_by_endpoint.market_ws]
scope = "websocket_market"
budget_kind = "endpoint"
limit = "official_doc_configured"

[rate_budgets_by_endpoint.user_ws]
scope = "websocket_user"
budget_kind = "endpoint"
limit = "official_doc_configured"

[rate_budgets_by_endpoint.clob_orders]
scope = "rest_clob_orders"
budget_kind = "endpoint"
limit = "official_doc_configured"

[rate_budgets_by_endpoint.geoblock]
scope = "rest_geoblock"
budget_kind = "endpoint"
limit = "official_doc_configured"

[rate_budgets_by_endpoint.discovery]
scope = "rest_gamma_events"
budget_kind = "endpoint"
limit = "official_doc_configured"

[rate_budgets_by_endpoint.time]
scope = "rest_clob_time"
budget_kind = "endpoint"
limit = "official_doc_configured"

[discovery_filters]
active = true
closed = false
limit = 100
offset = 0
sports_only = true
game_tag_id = 100639
allowed_market_types = ["moneyline", "spread", "total"]

[sport_filters]
allowed_sports = ["nba", "nfl", "mlb", "nhl", "atp", "wta", "tennis", "soccer"]

[local_csv]
enabled = false
base_dir = "output/local-csv"
flush_every_rows = 1
rotate_daily = false
include_raw_refs = true
write_single_provider_files = true
write_comparison_files = false
