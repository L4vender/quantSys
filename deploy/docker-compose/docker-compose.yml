name: quantsys-local

services:
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    profiles: ["local"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk -X brokers=localhost:9092 cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    profiles: ["local"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quantsys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quantsys}
      POSTGRES_DB: ${POSTGRES_DB:-quantsys}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-quantsys} -d $${POSTGRES_DB:-quantsys}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    profiles: ["local"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-quantsys}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-quantsys}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-quantsys}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../../migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $${CLICKHOUSE_USER:-quantsys} --password $${CLICKHOUSE_PASSWORD:-quantsys} --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    profiles: ["local"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: ["local"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-quantsys-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-quantsys-local-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    profiles: ["local"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-quantsys-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-quantsys-local-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-quantsys-raw}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/\"$${MINIO_BUCKET}\" &&
      mc anonymous set none local/\"$${MINIO_BUCKET}\"
      "
    restart: "no"

volumes:
  redpanda-data:
  postgres-data:
  clickhouse-data:
  redis-data:
  minio-data:
